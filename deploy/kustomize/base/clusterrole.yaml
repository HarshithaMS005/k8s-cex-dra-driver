apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cex-dra-driver
  labels:
    app.kubernetes.io/name: cex-dra-driver
rules:
  # ResourceClaim reads during NodePrepareResources (kubelet plugin handler)
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get"]
  # ResourceSlice lifecycle (internal/driver/driver.go - scanAndPublish). The
  # vendored resourceslice controller only lists/watches and
  # creates/updates/deletes - no get, no patch.
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["list", "watch", "create", "update", "delete"]
  # The vendored resourceslice controller gets the Node once to resolve its
  # UID for the ResourceSlice owner reference (garbage collection anchor).
  # Without it the controller hot-loops on forbidden and publishes nothing.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
