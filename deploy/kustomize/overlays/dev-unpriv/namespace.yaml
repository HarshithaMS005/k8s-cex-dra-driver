apiVersion: v1
kind: Namespace
metadata:
  name: cex-dra-driver
  labels:
    # Same posture as the template overlay's namespace: the DaemonSet exceeds
    # the baseline Pod Security Standard (hostPath volumes, runAsUser: 0,
    # spc_t via selinux-spc), so the namespace enforces the privileged level.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
