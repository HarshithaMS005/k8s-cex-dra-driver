apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Opt-in: sets CEX_DRA_SKIP_PREFLIGHT=1 on the plugin container. All preflight
# error results become warnings and the binary never exits the preflight phase.
# Intended for smoke tests, mock-zcrypt demos, and developer environments where
# prerequisites are deliberately absent. Do not enable in production.
patches:
  - target:
      kind: DaemonSet
      name: cex-dra-driver
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CEX_DRA_SKIP_PREFLIGHT
          value: "1"
